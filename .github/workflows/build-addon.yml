name: build-addon

on:
  workflow_call:
    inputs:
      trussc_ref:
        description: 'TrussC ref (branch/tag/commit)'
        type: string
        default: 'main'
      addon_name:
        description: 'Addon directory name under addons/'
        type: string
        required: true
      test_app:
        description: 'Test app directory under addons/{addon_name}/ (optional, for build verification)'
        type: string
        default: ''
      test_mode:
        description: 'build-only | run | test (run=continue-on-error, test=fail on non-zero exit)'
        type: string
        default: 'run'
      configs:
        description: 'JSON array of build configs'
        type: string
        default: '["Release"]'
      preprocessor_defines:
        description: 'Windows preprocessor defines (semicolon-separated)'
        type: string
        default: ''
      extra_apt_packages:
        description: 'Extra Linux apt packages (space-separated)'
        type: string
        default: ''
      cache_key_suffix:
        description: 'Cache key suffix for busting'
        type: string
        default: 'v2'
      extra_addons:
        description: 'Extra addons to clone into TrussC/addons/ (space-separated: owner/repo name [owner/repo name]...)'
        type: string
        default: ''
      trusscli_prebuilt:
        description: 'auto | off | strict. auto tries a release prebuilt then falls back to cache/build; strict fails if unavailable.'
        type: string
        default: 'auto'
      trusscli_prebuilt_repo:
        description: 'Repository containing trusscli prebuilt release assets.'
        type: string
        default: '2bbb/trussc-actions'
      trusscli_prebuilt_tag:
        description: 'Exact release tag containing trusscli prebuilt assets. Required for prebuilt auto/strict.'
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, windows, linux]
        config: ${{ fromJson(inputs.configs) }}
        include:
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    name: build / build-${{ matrix.platform }} (${{ matrix.config }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ inputs.addon_name }}

      - name: Clone TrussC
        run: git clone --depth 1 --branch ${{ inputs.trussc_ref }} https://github.com/TrussC-org/TrussC.git TrussC

      - name: Link addon into TrussC
        if: matrix.platform != 'windows'
        run: ln -s $GITHUB_WORKSPACE/${{ inputs.addon_name }} TrussC/addons/${{ inputs.addon_name }}

      - name: Link addon into TrussC (Windows)
        if: matrix.platform == 'windows'
        run: New-Item -ItemType SymbolicLink -Path "TrussC\addons\${{ inputs.addon_name }}" -Target "$env:GITHUB_WORKSPACE\${{ inputs.addon_name }}"

      - name: Clone extra addons
        if: inputs.extra_addons != ''
        shell: bash
        run: |
          read -ra ADDON_PAIRS <<< "${{ inputs.extra_addons }}"
          for i in $(seq 0 2 $((${#ADDON_PAIRS[@]} - 1))); do
            REPO="${ADDON_PAIRS[$i]}"
            NAME="${ADDON_PAIRS[$((i+1))]}"
            echo "Cloning extra addon: $NAME from $REPO"
            git clone --depth 1 "https://github.com/$REPO.git" "TrussC/addons/$NAME"
          done

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgtk-3-dev ${{ inputs.extra_apt_packages }}

      - name: Install TrussC Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          cd TrussC
          chmod +x tools/install_dependencies_linux.sh
          sudo ./tools/install_dependencies_linux.sh -y

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve trusscli path
        id: trusscli-path
        shell: bash
        run: |
          arch="$(uname -m)"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            trusscli="$GITHUB_WORKSPACE/TrussC/tools/trusscli.app/Contents/MacOS/trusscli"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            trusscli="$GITHUB_WORKSPACE/TrussC/tools/bin/trusscli.exe"
          else
            trusscli="$GITHUB_WORKSPACE/TrussC/tools/bin/trusscli"
          fi
          echo "path=$trusscli" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "asset=trusscli-${{ matrix.platform }}-${arch}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "metadata=trusscli-${{ matrix.platform }}-${arch}.metadata.json" >> "$GITHUB_OUTPUT"
          echo "sha=trusscli-${{ matrix.platform }}-${arch}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Acquire prebuilt trusscli
        id: trusscli-prebuilt
        if: inputs.trusscli_prebuilt != 'off'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREBUILT_MODE: ${{ inputs.trusscli_prebuilt }}
          PREBUILT_REPO: ${{ inputs.trusscli_prebuilt_repo }}
          PREBUILT_TAG: ${{ inputs.trusscli_prebuilt_tag }}
          PREBUILT_ASSET: ${{ steps.trusscli-path.outputs.asset }}
          PREBUILT_METADATA: ${{ steps.trusscli-path.outputs.metadata }}
          PREBUILT_SHA: ${{ steps.trusscli-path.outputs.sha }}
          TRUSSCLI_PATH: ${{ steps.trusscli-path.outputs.path }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          PREBUILT_ARCH: ${{ steps.trusscli-path.outputs.arch }}
          TRUSSC_REF: ${{ inputs.trussc_ref }}
        run: |
          set -euo pipefail
          echo "used=false" >> "$GITHUB_OUTPUT"
          if [ -z "$PREBUILT_TAG" ]; then
            message="trusscli prebuilt tag is empty; skipping prebuilt acquisition"
            if [ "$PREBUILT_MODE" = "strict" ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::notice::$message"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/trusscli-prebuilt"
          echo "Attempting trusscli prebuilt download"
          echo "repo=$PREBUILT_REPO"
          echo "tag=$PREBUILT_TAG"
          echo "asset=$PREBUILT_ASSET"
          echo "metadata=$PREBUILT_METADATA"
          echo "sha=$PREBUILT_SHA"
          if ! gh release download "$PREBUILT_TAG" --repo "$PREBUILT_REPO" --pattern "$PREBUILT_ASSET" --pattern "$PREBUILT_METADATA" --pattern "$PREBUILT_SHA" --dir "$RUNNER_TEMP/trusscli-prebuilt"; then
            if [ "$PREBUILT_MODE" = "strict" ]; then
              echo "::error::strict trusscli prebuilt download failed"
              exit 1
            fi
            echo "::warning::trusscli prebuilt unavailable; falling back to cache/build"
            exit 0
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tarfile

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def relative_to_or_fail(path, root):
              try:
                  return path.resolve().relative_to(root.resolve())
              except ValueError as exc:
                  raise SystemExit(f'unsafe archive member path: {path}') from exc

          def safe_extract(archive, destination):
              destination.mkdir(parents=True, exist_ok=True)
              for member in archive.getmembers():
                  if member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive link member: {member.name}')
                  target = destination / member.name
                  relative_to_or_fail(target, destination)
              archive.extractall(destination)

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'trusscli-prebuilt'
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          tools_root = workspace / 'TrussC' / 'tools'
          asset = root / os.environ['PREBUILT_ASSET']
          metadata = root / os.environ['PREBUILT_METADATA']
          sha_file = root / os.environ['PREBUILT_SHA']
          trusscli = pathlib.Path(os.environ['TRUSSCLI_PATH'])
          expected_binary_rel = trusscli.resolve().relative_to(tools_root.resolve()).as_posix()
          if not asset.is_file() or not metadata.is_file() or not sha_file.is_file():
              raise SystemExit('prebuilt asset, metadata, or checksum file is missing')

          asset_digest = sha256_file(asset)
          expected_asset_digest = sha_file.read_text(encoding='utf-8').split()[0]
          if asset_digest != expected_asset_digest:
              raise SystemExit(f'prebuilt sha256 mismatch: expected {expected_asset_digest}, got {asset_digest}')

          data = json.loads(metadata.read_text(encoding='utf-8'))
          required = [
              'platform',
              'arch',
              'trussc_ref',
              'trussc_commit',
              'trussc_actions_commit',
              'release_tag',
              'asset_name',
              'asset_sha256',
              'binary_relative_path',
              'binary_sha256',
          ]
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit(f'prebuilt metadata missing fields: {missing}')

          local_trussc_commit = subprocess.check_output(
              ['git', '-C', str(workspace / 'TrussC'), 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          expected_metadata = {
              'platform': os.environ['MATRIX_PLATFORM'],
              'arch': os.environ['PREBUILT_ARCH'],
              'release_tag': os.environ['PREBUILT_TAG'],
              'trussc_ref': os.environ['TRUSSC_REF'],
              'trussc_commit': local_trussc_commit,
              'asset_name': os.environ['PREBUILT_ASSET'],
              'asset_sha256': asset_digest,
              'binary_relative_path': expected_binary_rel,
          }
          for key, expected in expected_metadata.items():
              actual = data.get(key)
              if actual != expected:
                  raise SystemExit(f'prebuilt metadata {key} mismatch: expected {expected}, got {actual}')

          trusscli.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(asset, 'r:gz') as archive:
              safe_extract(archive, tools_root)
          if not trusscli.is_file():
              raise SystemExit(f'prebuilt extraction did not create {trusscli}')

          binary_digest = sha256_file(trusscli)
          if data.get('binary_sha256') != binary_digest:
              raise SystemExit(f'prebuilt binary sha256 mismatch: expected {data.get("binary_sha256")}, got {binary_digest}')

          print('PREBUILT_TRUSSCLI_IDENTITY ' + json.dumps(data, sort_keys=True))
          print(f'prebuilt_binary_path={trusscli}')
          print(f'prebuilt_binary_sha256={binary_digest}')
          PY

          if [ "${{ matrix.platform }}" != "windows" ]; then
            chmod +x "$TRUSSCLI_PATH"
          fi
          if [ ! -x "$TRUSSCLI_PATH" ] && [ "${{ matrix.platform }}" != "windows" ]; then
            echo "::error::prebuilt trusscli is not executable: $TRUSSCLI_PATH"
            exit 1
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          trusscli = pathlib.Path(os.environ['TRUSSCLI_PATH'])
          result = subprocess.run([str(trusscli), '--help'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=20)
          print(result.stdout[:4000])
          if result.returncode != 0:
              raise SystemExit(f'trusscli --help failed with exit code {result.returncode}')
          PY
          echo "used=true" >> "$GITHUB_OUTPUT"
          echo "Using verified prebuilt trusscli: $TRUSSCLI_PATH"

      - name: Cache trusscli build
        id: trusscli-cache
        if: steps.trusscli-prebuilt.outputs.used != 'true'
        uses: actions/cache@v4
        with:
          path: |
            TrussC/core/build-${{ matrix.platform }}
            TrussC/tools/build
            TrussC/tools/bin
            TrussC/tools/trusscli.app
          key: trusscli-${{ matrix.platform }}-${{ inputs.cache_key_suffix }}-${{ inputs.trussc_ref }}-${{ hashFiles('TrussC/tools/**', 'TrussC/core/**', 'TrussC/CMakeLists.txt') }}
          restore-keys: |
            trusscli-${{ matrix.platform }}-${{ inputs.cache_key_suffix }}-${{ inputs.trussc_ref }}-

      - name: Check cached trusscli
        id: trusscli-check
        shell: bash
        run: |
          trusscli="${{ steps.trusscli-path.outputs.path }}"

          if [ -f "$trusscli" ]; then
            if [ "${{ matrix.platform }}" != "windows" ]; then
              chmod +x "$trusscli"
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Using existing trusscli: $trusscli"
            python3 -c "import hashlib, os, pathlib; path = pathlib.Path(os.environ['TRUSSCLI_PATH']); print(f'trusscli_binary_path={path}'); print(f'trusscli_binary_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}')"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No trusscli binary found for ${{ matrix.platform }}"
          fi
        env:
          TRUSSCLI_PATH: ${{ steps.trusscli-path.outputs.path }}

      - name: Build trusscli (macOS)
        if: matrix.platform == 'macos' && steps.trusscli-check.outputs.exists != 'true'
        run: |
          cd TrussC
          sed -i '' 's/read -r -p/#read -r -p/g' tools/build_mac.command
          sed -i '' 's/open /#open /g' tools/build_mac.command
          ./tools/build_mac.command

      - name: Build trusscli (Windows)
        if: matrix.platform == 'windows' && steps.trusscli-check.outputs.exists != 'true'
        run: |
          cd TrussC
          ./tools/build_win.bat

      - name: Build trusscli (Linux)
        if: matrix.platform == 'linux' && steps.trusscli-check.outputs.exists != 'true'
        run: |
          cd TrussC
          chmod +x tools/build_linux.sh
          sed -i 's/read -r -p/#read -r -p/g' tools/build_linux.sh
          sed -i 's|"$SCRIPT_DIR/trusscli"|#&|g' tools/build_linux.sh
          ./tools/build_linux.sh

      - name: Generate test project
        if: inputs.test_app == ''
        shell: bash
        run: |
          mkdir -p test-project/src && cd test-project
          echo "${{ inputs.addon_name }}" > addons.make
          printf '#include "${{ inputs.addon_name }}.h"\nint main() { return 0; }\n' > src/main.cpp

          trusscli="${{ steps.trusscli-path.outputs.path }}"
          "$trusscli" update -p .

      - name: Use existing test app
        if: inputs.test_app != ''
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/${{ inputs.addon_name }}/${{ inputs.test_app }}"
          trusscli="${{ steps.trusscli-path.outputs.path }}"
          "$trusscli" update -p .

      - name: Build
        id: build
        shell: bash
        run: |
          if [ -n "${{ inputs.test_app }}" ]; then
            build_dir="$GITHUB_WORKSPACE/${{ inputs.addon_name }}/${{ inputs.test_app }}/build-${{ matrix.platform }}"
          else
            build_dir="$GITHUB_WORKSPACE/test-project/build-${{ matrix.platform }}"
          fi
          cd "$build_dir"
          cmake --build . --config ${{ matrix.config }}

          if [ -n "${{ inputs.test_app }}" ]; then
            search_dir="$GITHUB_WORKSPACE/${{ inputs.addon_name }}/${{ inputs.test_app }}"
            exe_names="-name testApp -o -name testApp.exe -o -name testApp_debug"
          else
            search_dir="$GITHUB_WORKSPACE/test-project"
            exe_names="-name test-project -o -name test-project.exe"
          fi
          found_bin=$(find "$search_dir" -type f \( $exe_names \) \( -perm -u+x -o -perm -g+x -o -perm -o+x \) 2>/dev/null | head -1)
          if [ -n "$found_bin" ]; then
            echo "bin_path=$found_bin" >> $GITHUB_OUTPUT
            echo "Found: $found_bin"
          else
            echo "bin_path=" >> $GITHUB_OUTPUT
            echo "::warning::testApp binary not found after build"
          fi

      - name: Run test app
        id: run
        if: inputs.test_mode != 'build-only'
        shell: bash
        continue-on-error: true
        run: |
          found_bin="${{ steps.build.outputs.bin_path }}"

          if [ -z "$found_bin" ] || [ ! -f "$found_bin" ]; then
            echo "::error::testApp binary not found"
            echo "exit_code=127" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Running: $found_bin"
          "$found_bin"
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check result
        if: inputs.test_mode != 'build-only'
        shell: bash
        run: |
          CODE=${{ steps.run.outputs.exit_code }}
          if [ -z "$CODE" ]; then CODE=1; fi
          echo "Exit code: $CODE"
          if [ "$CODE" -ge 128 ]; then
            echo "::error::Process crashed with signal (exit code $CODE)"
            exit 1
          fi
          if [ "$CODE" -eq 127 ]; then
            echo "::error::testApp binary not found"
            exit 1
          fi
          if [ "${{ inputs.test_mode }}" = "test" ] && [ "$CODE" -ne 0 ]; then
            echo "::error::Test failed with exit code $CODE"
            exit 1
          fi
